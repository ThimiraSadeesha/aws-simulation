[package]
name = "cloudsim-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"
description = "CloudSim simulation engine: in-memory lifecycle, network, LB, autoscaling, storage and fault simulation for an educational AWS-style cloud simulator"
publish = false

[lib]
name = "cloudsim_engine"
path = "src/lib.rs"
bench = false

[[bin]]
name = "cloudsim-engine"
path = "src/main.rs"
bench = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
rand = "0.8"
rand_chacha = "0.3"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "transitions"
harness = false

[[bench]]
name = "events"
harness = false

[[bench]]
name = "reachability"
harness = false

[[bench]]
name = "lb"
harness = false

[profile.release]
strip = true
